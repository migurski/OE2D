[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oe2d"
version = "0.1.0"
description = "OpenElections source-to-data tooling: locate and extract election result sources"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber",
    "openpyxl",
    "pypdf",
    "xlrd==1.2.0",
    "xlwt",
    "pydantic>=2",
    "dspy>=2.5",
    "boto3",
    "python-dotenv",
    "numpy",
    "Pillow",
]

# cmpnd powers optional LLM-call tracing (oe2d.*._instrument, active when CMPND_API_KEY is set);
# install with `pip install -e .[tracing]`. The soft import means its absence is silent, so it is
# an extra rather than a hard dependency.
[project.optional-dependencies]
tracing = ["cmpnd"]

# Console-script names mirror the dotted module path (dots -> dashes).
[project.scripts]
oe2d-contests = "oe2d.contests:main"
oe2d-contests-evaluate = "oe2d.contests.evaluate:main"
oe2d-pages = "oe2d.pages:main"
oe2d-pages-optimize = "oe2d.pages.optimize:main"
oe2d-pages-evaluate = "oe2d.pages.evaluate:main"
oe2d-votes = "oe2d.votes:main"
oe2d-votes-optimize = "oe2d.votes.optimize:main"
oe2d-votes-evaluate = "oe2d.votes.evaluate:main"
oe2d-rendering = "oe2d.rendering:main"

[tool.setuptools]
packages = ["oe2d", "oe2d.pages", "oe2d.contests", "oe2d.votes"]

# The trained programs ship as package data; the oe2d-data/ gold sets, fixtures,
# and page images are outside any package dir, so they are never in the wheel.
[tool.setuptools.package-data]
"oe2d.pages" = ["model/*.json"]
"oe2d.contests" = ["model/*.json"]
"oe2d.votes" = ["model/*.json"]
