[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oe2d"
version = "0.1.0"
description = "OpenElections source-to-data tooling: categorize and extract election result sources"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber",
    "openpyxl",
    "xlrd==1.2.0",
    "pydantic>=2",
    "dspy>=2.5",
]

[project.scripts]
oe2d-categorize-source = "oe2d.categorize:main"

# Reuse the existing top-level source_table.py without moving it, so the
# pre-existing find-contest-*.py scripts keep importing it unchanged.
[tool.setuptools]
packages = ["oe2d"]
py-modules = ["source_table"]
