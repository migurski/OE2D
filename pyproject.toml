[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oe2d"
version = "0.1.0"
description = "OpenElections source-to-data tooling: categorize and extract election result sources"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber",
    "openpyxl",
    "pypdf",
    "xlrd==1.2.0",
    "xlwt",
    "pydantic>=2",
    "dspy>=2.5",
    "boto3",
]

[project.scripts]
oe2d-categorize-source = "oe2d.categorize:main"
oe2d-make-fixture = "oe2d.categorize.fixture:main"
oe2d-label-categories = "oe2d.categorize.label:main"

[tool.setuptools]
packages = ["oe2d", "oe2d.categorize"]
