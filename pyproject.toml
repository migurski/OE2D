[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oe2d"
version = "0.1.0"
description = "OpenElections source-to-data tooling: categorize and extract election result sources"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber",
    "openpyxl",
    "pypdf",
    "xlrd==1.2.0",
    "xlwt",
    "pydantic>=2",
    "dspy>=2.5",
    "boto3",
    "python-dotenv",
]

[project.scripts]
oe2d-categorize-source = "oe2d.categorize:main"
oe2d-make-fixture = "oe2d.categorize.fixture:main"
oe2d-label-categories = "oe2d.categorize.label:main"
oe2d-optimize-categorizer = "oe2d.categorize.optimize:main"
oe2d-render-page = "oe2d.categorize.rendering:main"
oe2d-analyze-page = "oe2d.pages:main"
oe2d-optimize-pages = "oe2d.pages.optimize:main"

[tool.setuptools]
packages = ["oe2d", "oe2d.categorize", "oe2d.pages"]

# The trained programs ship as package data; the oe2d-data/ gold sets, fixtures,
# and page images are outside any package dir, so they are never in the wheel.
[tool.setuptools.package-data]
"oe2d.categorize" = ["model/*.json"]
"oe2d.pages" = ["model/*.json"]
